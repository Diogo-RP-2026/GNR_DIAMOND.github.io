# A função valida palavra-passe ou prova aleatória no seu próprio handler.
# Registo e recuperação começam antes de existir um JWT de utilizador.
[functions.portal-otp]
verify_jwt = false

[functions.agent-avatar]
verify_jwt = true

# Auth.getUser and database liveness/role checks validate bearer tokens.
# Supports the project's current asymmetric signing keys.
[functions.account-admin]
verify_jwt = false
